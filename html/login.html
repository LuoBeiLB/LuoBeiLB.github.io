<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录页面</title>
    <link rel="stylesheet" href="/css/login.css">
</head>

<body>
    <div class="background-overlay"></div>
    <div class="login-container">
        <h2 class="text-2xl font-bold mb-4" id="font">登录</h2>
        <input type="text" class="input-field" placeholder="邮箱" id="email">
        <input type="text" class="input-field" placeholder="用户名" id="username">
        <input type="password" class="input-field" placeholder="密码" id="password">
        <div class="other" id="other">
            <a onclick="register()">注册账号</a>
            <a>忘记密码</a>
        </div>
        <button class="login-button" onclick="login()" id="login">登录</button>
        <button class="login-button" onclick="gotoregist()" id="register">注册</button>
    </div>
</body>

</html>

<script src="/js/gotologin.js"></script>
